<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDV 販売実績ダッシュボード</title>
<style>
:root{
  --bg:#0F1B14;
  --panel:#16241C;
  --panel-2:#1C2E23;
  --line:#2A3E31;
  --ink:#EDF3EC;
  --ink-dim:#AFC4B6;
  --ink-faint:#7E9587;
  --accent:#E8A33D;
  --danger:#C4674F;
  /* channel families (validated: dataviz validate_palette.js, dark, surface #16241C, this stack order) */
  --g-store:#3987e5;
  --g-online:#d95926;
  --g-event:#199e70;
  --g-consignment:#9085e9;
  --g-service:#c98500;
  --other-gray:#7E9587;
  --sans:"Noto Sans JP","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Meiryo","Yu Gothic","Leelawadee UI",sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Roboto Mono",monospace;
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:radial-gradient(1200px 500px at 10% -10%, rgba(232,163,61,0.07), transparent), var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;padding:32px 20px 60px;
}
.wrap{max-width:1180px;margin:0 auto;}
header{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:12px;flex-wrap:wrap;gap:16px;}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
h1{margin:0;font-size:28px;font-weight:700;}
.period{font-family:var(--mono);color:var(--ink-dim);font-size:13px;line-height:1.7;margin:6px 0 22px;}
.period b{color:var(--ink);}
.lang-toggle{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;}
.lang-btn{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-dim);background:transparent;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;}
.lang-btn:hover{color:var(--ink);}
.lang-btn.active{background:var(--accent);color:#16241C;}
.lang-btn:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto;}
nav.tabs button{background:none;border:none;padding:11px 16px;font-size:13.5px;font-family:var(--mono);font-weight:600;color:var(--ink-dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab{display:none;}
.tab.active{display:block;}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:22px;}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.card-head h2{margin:0;font-size:16px;font-weight:700;}
.card-head h2 .num{font-family:var(--mono);color:var(--accent);margin-right:8px;font-size:13px;}
h3.sub{font-size:13.5px;color:var(--ink-dim);margin:0 0 10px;font-weight:600;}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
select,.seg button{font-family:var(--sans);font-size:13px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 10px;}
select{cursor:pointer;max-width:100%;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
.seg button{border:none;border-radius:0;cursor:pointer;color:var(--ink-dim);background:var(--panel-2);}
.seg button.active{background:var(--accent);color:#16241C;font-weight:700;}
.note{color:var(--ink-faint);font-size:12.5px;margin:10px 0 0;}
.note.top{margin:-6px 0 12px;}
.box{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.kpi .lbl{font-size:12.5px;color:var(--ink-dim);}
.kpi .val{font-size:30px;font-weight:700;line-height:1.25;margin-top:4px;}
.kpi .val2{font-size:20px;font-weight:700;margin-top:6px;}
.kpi .unit{font-size:13px;color:var(--ink-dim);font-weight:500;margin-left:4px;}
.kpi .sub{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.kpi-mix{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;margin-top:12px;}
.mini-legend{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--ink-dim);}
.mini-legend div{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;}
.mini-legend .pct{font-family:var(--mono);}
.chart{position:relative;width:100%;}
.chart svg{display:block;width:100%;height:auto;overflow:visible;}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-dim);margin-bottom:10px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.vlegend{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-dim);}
.vlegend div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:2px 4px;border-radius:4px;}
.vlegend span{overflow-wrap:anywhere;}
.vlegend div.hl{background:rgba(232,163,61,.10);}
.vlegend .pct{font-family:var(--mono);color:var(--ink);}
.donut-wrap{display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:18px;align-items:center;}
section.card > .donut-wrap{grid-template-columns:minmax(160px,240px) minmax(0,420px);}
section.card > .donut-wrap.share-wrap{grid-template-columns:minmax(160px,220px) minmax(0,1fr);}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;}
.axis text{fill:var(--ink-faint);font-size:11px;font-family:var(--mono);}
.axis line.grid{stroke:var(--line);stroke-width:1;}
.axis line.base{stroke:#3a5243;stroke-width:1;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;}
th{color:var(--ink-dim);font-weight:600;font-size:12px;}
th:first-child,td:first-child{text-align:left;}
td{font-variant-numeric:tabular-nums;}
td.l,th.l{text-align:left;}
tr.total td{font-weight:700;border-top:1px solid var(--ink-faint);}
tr.hl td{background:rgba(232,163,61,.10);}
tr.sub td{color:var(--ink-faint);}
tr.period td{color:var(--ink-dim);background:rgba(255,255,255,.02);}
th.sortable{cursor:pointer;user-select:none;}
th.sortable:hover{color:var(--ink);}
th .arrow{color:var(--accent);}
.tbl-scroll{overflow-x:auto;}
.name-cell{display:inline-flex;align-items:center;gap:8px;}
.donut path{cursor:pointer;transition:opacity .15s;}
.donut.dim path:not(.on){opacity:.28;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.btn-more{background:none;border:1px solid var(--line);color:var(--ink-dim);border-radius:7px;padding:7px 14px;cursor:pointer;font-size:13px;}
.btn-more.on{border-color:var(--accent);color:var(--ink);}
.btn-more:hover{color:var(--ink);border-color:var(--accent);}
.detail{margin-top:14px;}
.hlist{display:flex;flex-direction:column;gap:7px;}
.hlist .row{display:grid;grid-template-columns:minmax(120px,210px) 1fr 70px;gap:10px;align-items:center;font-size:12.5px;}
.hlist .lab{color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hlist .track{height:14px;background:transparent;border-radius:0 4px 4px 0;}
.hlist .fill{height:100%;border-radius:0 4px 4px 0;}
.hlist .v{text-align:right;font-family:var(--mono);color:var(--ink);}
.line-dot{cursor:pointer;}
.tip{position:fixed;pointer-events:none;background:#0B140F;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:50;display:none;max-width:300px;}
.tip .t{font-weight:700;margin-bottom:4px;}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums;}
.tip .r span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);}
.about h3{font-size:15px;margin:18px 0 8px;}
.about h3:first-child{margin-top:0;}
.about p,.about li{color:var(--ink-dim);font-size:13.5px;}
.about ul{padding-left:20px;margin:6px 0;}
.about td,.about th{white-space:normal;}
.warn{border-left:3px solid var(--accent);background:var(--panel-2);padding:10px 14px;border-radius:6px;color:var(--ink-dim);font-size:13.5px;}
@media (max-width:900px){
  .kpis{grid-template-columns:1fr;}
  .grid2{grid-template-columns:1fr;}
}
@media (max-width:560px){
  body{padding:20px 16px 48px;}
  h1{font-size:22px;}
  .kpi .val{font-size:26px;}
  section.card{padding:16px 14px;}
  .donut-wrap,section.card > .donut-wrap{grid-template-columns:minmax(0,1fr);}
  .hlist .row{grid-template-columns:110px 1fr 56px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Endeavors Co., Ltd. · EDV</div>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button class="lang-btn" data-lang="ja">日本語</button>
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="th">ไทย</button>
    </div>
  </header>
  <div class="period" id="periodLine"></div>

  <nav class="tabs" role="tablist">
    <button data-tab="overview" class="active" data-i18n="tab_overview"></button>
    <button data-tab="vff" data-i18n="tab_vff"></button>
    <button data-tab="channels" data-i18n="tab_channels"></button>
    <button data-tab="products" data-i18n="tab_products"></button>
    <button data-tab="about" data-i18n="tab_about"></button>
  </nav>

  <!-- ============ overview ============ -->
  <div class="tab active" id="tab-overview">
    <section class="card">
      <div class="card-head">
        <h2><span class="num">01</span><span data-i18n="s_summary"></span></h2>
        <div class="controls"><select id="kpiPeriod"></select></div>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="btn-row"><button class="btn-more" id="sumDetailBtn"></button></div>
      <div class="detail tbl-scroll" id="sumDetail" hidden></div>
      <p class="note" data-i18n="note_exvat"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span class="num">02</span><span data-i18n="s_monthly_total"></span></h2>
      </div>
      <div class="chart" id="monthlyChart"></div>
    </section>
  </div>

  <!-- ============ VFF shoes ============ -->
  <div class="tab" id="tab-vff">
    <section class="card">
      <div class="card-head"><h2><span class="num">01</span><span data-i18n="vff01"></span></h2></div>
      <p class="note top" data-i18n="vff01_note"></p>
      <div class="legend" id="vffStoreLegend"></div>
      <div class="chart" id="vffStoreChart"></div>
      <div class="btn-row"><button class="btn-more" id="vffStoreBtn"></button></div>
      <div class="detail tbl-scroll" id="vffStoreDetail" hidden></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span class="num">02</span><span data-i18n="vff02"></span></h2>
        <div class="controls">
          <div class="seg" id="vffChMetric">
            <button data-v="pairs" class="active" data-i18n="m_pairs"></button>
            <button data-v="amt" data-i18n="m_amount"></button>
          </div>
          <select id="vffChPeriod"></select>
        </div>
      </div>
      <div class="grid2">
        <div class="box"><h3 class="sub" data-i18n="vff02_share"></h3><div class="donut-wrap"><div class="chart" id="vffChDonut"></div><div class="vlegend" id="vffChLegend"></div></div></div>
        <div class="box tbl-scroll"><h3 class="sub" data-i18n="vff02_break"></h3><div id="vffChTable"></div></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span class="num">03</span><span data-i18n="vff03"></span></h2>
        <div class="controls"><select id="vffGPeriod"></select></div>
      </div>
      <p class="note top" data-i18n="vff03_note"></p>
      <div class="donut-wrap"><div class="chart" id="vffGDonut"></div><div class="tbl-scroll" id="vffGTable"></div></div>
      <div class="btn-row"><button class="btn-more" id="vffGBtn"></button></div>
      <div class="detail tbl-scroll" id="vffGDetail" hidden></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span class="num">04</span><span data-i18n="vff04"></span></h2>
        <div class="controls"><select id="vffMPeriod"></select></div>
      </div>
      <p class="note top" data-i18n="vff04_note"></p>
      <div id="vffMChart"></div>
      <div class="btn-row"><button class="btn-more" id="vffMBtn"></button></div>
      <div class="detail tbl-scroll" id="vffMDetail" hidden></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span class="num">05</span><span data-i18n="vff05"></span></h2>
        <div class="controls"><select id="vffCPeriod"></select></div>
      </div>
      <p class="note top" data-i18n="vff05_note"></p>
      <div id="vffCChart"></div>
      <div class="btn-row"><button class="btn-more" id="vffCBtn"></button></div>
      <div class="detail tbl-scroll" id="vffCDetail" hidden></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span class="num">06</span><span data-i18n="vff06"></span></h2>
        <div class="controls"><select id="vffSPeriod"></select></div>
      </div>
      <p class="note top" data-i18n="vff06_note"></p>
      <div class="legend" id="vffSLegend"></div>
      <div class="chart" id="vffSChart"></div>
      <div class="btn-row"><button class="btn-more" id="vffSBtn"></button></div>
      <div class="detail tbl-scroll" id="vffSDetail" hidden></div>
    </section>
  </div>

  <!-- ============ channels ============ -->
  <div class="tab" id="tab-channels">
    <section class="card">
      <div class="card-head">
        <h2><span class="num">01</span><span data-i18n="s_monthly"></span></h2>
        <div class="controls">
          <div class="seg" id="chMonthlyMetric">
            <button data-v="amt" class="active" data-i18n="m_amount"></button>
            <button data-v="qty" data-i18n="m_qty"></button>
          </div>
        </div>
      </div>
      <p class="note top" data-i18n="note_ch_split"></p>
      <div class="legend" id="chMonthlyLegend"></div>
      <div class="chart" id="chMonthlyChart"></div>
      <div class="btn-row">
        <button class="btn-more" id="chDetailBtn"></button>
        <button class="btn-more" id="chQtyBtn"></button>
      </div>
      <div class="detail tbl-scroll" id="chDetail" hidden></div>
      <div class="detail" id="chQty" hidden>
        <div class="controls" style="justify-content:flex-end;margin-bottom:10px"><select id="chtPeriod"></select></div>
        <div class="tbl-scroll" id="chTable"></div>
        <p class="note" data-i18n="note_sort"></p>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span class="num">02</span><span data-i18n="s_share"></span></h2>
        <div class="controls"><select id="sharePeriod"></select></div>
      </div>
      <div class="donut-wrap share-wrap"><div class="chart" id="shareDonut"></div><div class="tbl-scroll" id="shareTable"></div></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span class="num">03</span><span data-i18n="s_pay"></span></h2>
        <div class="controls"><select id="payChannel"></select><select id="payPeriod"></select></div>
      </div>
      <p class="note top" id="payNote"></p>
      <div class="donut-wrap"><div class="chart" id="payDonut"></div><div class="tbl-scroll" id="payTable"></div></div>
      <div class="btn-row"><button class="btn-more" id="payBtn"></button></div>
      <div class="detail tbl-scroll" id="payDetail" hidden></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span class="num">04</span><span data-i18n="s_chdetail"></span></h2>
        <div class="controls"><select id="chdChannel"></select><select id="chdPeriod"></select></div>
      </div>
      <div class="note top" id="chdSummary"></div>
      <div class="grid2">
        <div class="box"><h3 class="sub" data-i18n="chd_line"></h3><div class="chart" id="chdLine"></div></div>
        <div class="box"><h3 class="sub" data-i18n="chd_brand"></h3><div class="donut-wrap"><div class="chart" id="chdDonut"></div><div class="vlegend" id="chdLegend"></div></div></div>
      </div>
    </section>
  </div>

  <!-- ============ products ============ -->
  <div class="tab" id="tab-products">
    <section class="card">
      <div class="card-head">
        <h2><span class="num">01</span><span data-i18n="p01"></span></h2>
        <div class="controls">
          <select id="brMetric"></select>
          <select id="brPeriod"></select>
        </div>
      </div>
      <p class="note top" data-i18n="note_goods"></p>
      <div class="grid2">
        <div class="box"><h3 class="sub" data-i18n="p01_share"></h3><div class="donut-wrap"><div class="chart" id="brDonut"></div><div class="vlegend" id="brLegend"></div></div></div>
        <div class="box tbl-scroll"><h3 class="sub" data-i18n="p01_break"></h3><div id="brTable"></div></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span class="num">02</span><span data-i18n="p02"></span></h2>
        <div class="controls"><select id="cbChannel"></select><select id="cbPeriod"></select></div>
      </div>
      <p class="note top" data-i18n="p02_note"></p>
      <div class="donut-wrap"><div class="chart" id="cbDonut"></div><div class="vlegend" id="cbLegend"></div></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span class="num">03</span><span data-i18n="p03"></span></h2>
        <div class="controls"><select id="rkPeriod"></select></div>
      </div>
      <div class="grid2">
        <div class="box tbl-scroll"><h3 class="sub" data-i18n="top10"></h3><div id="rkTop"></div></div>
        <div class="box tbl-scroll"><h3 class="sub" data-i18n="worst10"></h3><div id="rkWorst"></div></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span class="num">04</span><span data-i18n="p04"></span></h2>
        <div class="controls"><select id="bdBrand"></select><select id="bdPeriod"></select></div>
      </div>
      <div class="note top" id="bdSummary"></div>
      <div class="tbl-scroll" id="bdTable"></div>
      <div class="btn-row"><button class="btn-more" id="bdMore"></button></div>
    </section>

    <section class="card">
      <div class="card-head"><h2><span class="num">05</span><span data-i18n="p05"></span></h2></div>
      <p class="note top" data-i18n="p05_note"></p>
      <div class="grid2">
        <div class="box"><h3 class="sub" data-i18n="p05_pairs"></h3><div class="chart" id="vsBar"></div></div>
        <div class="box"><h3 class="sub" data-i18n="p05_ratio"></h3><div class="chart" id="vsLine"></div></div>
      </div>
    </section>
  </div>

  <!-- ============ about ============ -->
  <div class="tab" id="tab-about">
    <section class="card about" id="about"></section>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
const DATA = /*__DATA__*/null;

/* ------------------------------------------------------------------ i18n */
const I18N = {
  ja: {
    title:'EDV 販売実績ダッシュボード',
    tab_overview:'全体', tab_vff:'VFFシューズ', tab_channels:'チャネル別', tab_products:'商品・ブランド別', tab_about:'このデータについて',
    s_summary:'全体サマリー', s_monthly:'月次推移(チャネル区分別)', s_share:'チャネル別構成',
    s_monthly_total:'月別売上金額', s_pay:'決済方法別比率(全体)', s_chdetail:'チャネルごとの詳細',
    chd_line:'月次売上推移', chd_brand:'ブランド構成比',
    m_amount:'金額', m_qty:'点数', m_pairs:'足数',
    k_sales:'売上金額(税抜)', k_qty:'販売点数', k_orders_aov:'伝票数・客単価', k_aov:'客単価(税抜)',
    unit_thb:'THB', unit_pcs:'点', unit_orders:'件', unit_pairs:'足',
    show_detail:'実績詳細を表示', hide_detail:'実績詳細を閉じる',
    qty_detail:'商品点数他詳細', qty_detail_hide:'商品点数他詳細を閉じる',
    more:'もっと見る', less:'閉じる',

function periods() {
  const ps = [{ id: 'all', months: M, label: `${t('p_all')} (${mName(M[0])}–${mName(M[M.length - 1])})` }];
  const q = ids => M.filter(m => ids.includes(+m.slice(5)));
  const add = (id, ms, label) => { if (ms.length) ps.push({ id, months: ms, label }); };
  if (q([1, 2, 3, 4, 5, 6]).length === 6) add('h1', q([1, 2, 3, 4, 5, 6]), t('p_h1'));
  if (q([1, 2, 3]).length === 3) add('q1', q([1, 2, 3]), t('p_q1'));
  if (q([4, 5, 6]).length === 3) add('q2', q([4, 5, 6]), t('p_q2'));
  const q3 = q([7, 8, 9]);
  if (q3.length) add('q3', q3, `${t('p_q3')} (${mName(q3[0])}–${mName(q3[q3.length - 1])})`);
  M.slice().reverse().forEach(m => add(m, [m], `${m.slice(0, 4)} ${mName(m)}`));
  return ps;
}

function chSum(ch, months) { // -> [amt, qty, orders]
  const r = [0, 0, 0];
  months.forEach(m => { const v = DATA.ch[ch]?.[m]; if (v) { r[0] += v[0]; r[1] += v[1]; r[2] += v[2]; } });
  return r;
}
const sumCh = (chs, months) => chs.reduce((a, c) => { const v = chSum(c, months); return [a[0] + v[0], a[1] + v[1], a[2] + v[2]]; }, [0, 0, 0]);
function brandSum(channels, months) { // -> {brand: [amt, qty]}
  const out = {};
  channels.forEach(c => months.forEach(m => {
    const bb = DATA.ch_brand[c]?.[m]; if (!bb) return;
    for (const b in bb) { if (b === 'Service') continue; const o = out[b] || (out[b] = [0, 0]); o[0] += bb[b][0]; o[1] += bb[b][1]; }

  return out;
}

  const agg = {};
  months.forEach(m => { const mm = DATA.model[m] || {};
    for (const k in mm) { const [b] = k.split('\t'); if (brand && b !== brand) continue;
      const o = agg[k] || (agg[k] = [0, 0]); o[0] += mm[k][0]; o[1] += mm[k][1]; } });
  return Object.entries(agg).map(([k, v]) => ({ b: k.split('\t')[0], m: k.split('\t')[1], amt: v[0], qty: v[1] }));
}
// VFF rows: [month, channel, model, gender, size, color, pairs, amount]
const vffRows = months => { const s = new Set(months); return DATA.vff.filter(r => s.has(r[0])); };
function vffBy(rows, keyFn) { // -> Map key -> [pairs, amt]
  const out = new Map();
  rows.forEach(r => { const k = keyFn(r); const o = out.get(k) || [0, 0]; o[0] += r[6]; o[1] += r[7]; out.set(k, o); });
  return out;
}
// fixed colors per channel for VFF charts: ranked once on the full period so a filter never repaints them
const VFF_CH_RANK = [...vffBy(DATA.vff, r => r[1]).entries()].sort((a, b) => b[1][0] - a[1][0]).map(e => e[0]);
const VFF_TOP_CH = VFF_CH_RANK.slice(0, 7);
const vffChKey = c => (VFF_TOP_CH.includes(c) ? c : '__other');
const vffChColor = k => (k === '__other' ? GRAY : HUES[VFF_TOP_CH.indexOf(k)]);
const vffChName = k => (k === '__other' ? t('other') : chName(k));
function paySum(channels, months) { // -> {method: amt}
  const out = {};
  channels.forEach(c => months.forEach(m => { const mm = DATA.pay[c]?.[m]; if (!mm) return;
    for (const k in mm) out[k] = (out[k] || 0) + mm[k]; }));
  return out;
}

const fmt = (v, d = 0) => (v ?? 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, tot) => (tot ? (v / tot * 100).toFixed(1) + '%' : '–');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sw = c => `<i class="sw" style="background:${c}"></i>`;
const $ = id => document.getElementById(id);

/* ------------------------------------------------------------------ tooltip */
const tip = $('tip');
function showTip(e, html) {
  tip.innerHTML = html; tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };

/* ------------------------------------------------------------------ charts */
// ~4 gridlines on a 1/2/2.5/5 x 10^n step, so ticks read 1M/2M/3M, not 1.3M/2.5M/3.8M
function niceStep(v) {
  if (v <= 0) return 1;
  const raw = v / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
const short = v => (v >= 1e6 ? +(v / 1e6).toFixed(2) + 'M' : v >= 1e3 ? +(v / 1e3).toFixed(1) + 'K' : fmt(v, v % 1 ? 1 : 0));
function axisY(max, step, W, L, R, yf, fmtTick = short) {
  let g = '';
  for (let v = 0; v <= max + step / 2; v += step) { const yy = yf(v);
    g += `<line class="${v ? 'grid' : 'base'}" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end">${fmtTick(v)}</text>`; }
  return g;
}
function chartSize(el) { const W = Math.max(300, Math.round(el.clientWidth || 760)); return { W, H: W < 520 ? 240 : 300 }; }

// stacked bars; series: [{color, values:[per category]}]; each segment gets a 2px surface gap,
// which is also how same-colored series (e.g. the 4 stores) read as separate blocks
function barChart(el, cats, catLabel, series, tipFor) {
  el._redraw = () => barChart(el, cats, catLabel, series, tipFor);
  const { W, H } = chartSize(el), L = 52, R = 4, T = 10, B = 28;
  const tot = cats.map((_, i) => series.reduce((s, x) => s + (x.values[i] || 0), 0));
  const top = Math.max(...tot, 0), step = niceStep(top), max = step * Math.max(1, Math.ceil(top / step));
  const pw = W - L - R, ph = H - T - B, slot = pw / cats.length, bw = Math.min(56, slot * 0.62);
  const y = v => T + ph - v / max * ph;
  let g = `<g class="axis">${axisY(max, step, W, L, R, y)}`;
  cats.forEach((c, i) => { g += `<text x="${L + slot * i + slot / 2}" y="${H - 8}" text-anchor="middle">${esc(catLabel(c))}</text>`; });
  g += '</g>';
  let bars = '';
  cats.forEach((c, i) => {
    const x = L + slot * i + (slot - bw) / 2;
    let acc = 0;
    const segs = series.map(s => ({ s, v: s.values[i] || 0 })).filter(o => o.v > 0);
    segs.forEach((o, k) => {
      const y0 = y(acc), y1 = y(acc + o.v); acc += o.v;
      const last = k === segs.length - 1, h = Math.max(0, y0 - y1 - (last ? 0 : 2));
      const r = last ? Math.min(4, h) : 0, yt = y1 + (last ? 0 : 2);
      const d = r ? `M${x},${yt + h} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${yt + h} Z`
                  : `M${x},${yt + h} V${yt} H${x + bw} V${yt + h} Z`;
      bars += `<path d="${d}" fill="${o.s.color}"/>`;
    });
    bars += `<rect x="${L + slot * i}" y="${T}" width="${slot}" height="${ph}" fill="transparent" data-i="${i}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${bars}</svg>`;
  const svg = el.querySelector('svg');
  svg.addEventListener('mousemove', e => { const tg = e.target.closest('[data-i]'); if (!tg) return hideTip(); showTip(e, tipFor(+tg.dataset.i)); });
  svg.addEventListener('mouseleave', hideTip);
}

// grouped bars (side by side); series: [{key, color, values}]
function groupedBarChart(el, cats, series, tipFor) {
  el._redraw = () => groupedBarChart(el, cats, series, tipFor);
  const { W, H } = chartSize(el), L = 44, R = 4, T = 10, B = 28;
  const top = Math.max(0, ...series.flatMap(s => s.values)), step = niceStep(top), max = step * Math.max(1, Math.ceil(top / step));
  const pw = W - L - R, ph = H - T - B, slot = pw / cats.length, n = series.length;
  const bw = Math.max(3, Math.min(16, (slot * 0.78 - (n - 1) * 2) / n));
  const y = v => T + ph - v / max * ph;
  let g = `<g class="axis">${axisY(max, step, W, L, R, y)}`;
  cats.forEach((c, i) => { g += `<text x="${L + slot * i + slot / 2}" y="${H - 8}" text-anchor="middle">${esc(c)}</text>`; });
  g += '</g>';
  let bars = '';
  cats.forEach((c, i) => {
    const x0 = L + slot * i + (slot - (n * bw + (n - 1) * 2)) / 2;
    series.forEach((s, k) => {
      const v = s.values[i] || 0; if (v <= 0) return;
      const x = x0 + k * (bw + 2), yt = y(v), h = y(0) - yt, r = Math.min(3, h, bw / 2);
      bars += `<path fill="${s.color}" d="M${x},${yt + h} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${yt + h} Z"/>`;
    });
    bars += `<rect x="${L + slot * i}" y="${T}" width="${slot}" height="${ph}" fill="transparent" data-i="${i}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${bars}</svg>`;
  const svg = el.querySelector('svg');
  svg.addEventListener('mousemove', e => { const tg = e.target.closest('[data-i]'); if (!tg) return hideTip(); showTip(e, tipFor(+tg.dataset.i)); });
  svg.addEventListener('mouseleave', hideTip);
}

// single-series line with crosshair hover
function lineChart(el, cats, values, color, tipFor, fmtTick = short) {
  el._redraw = () => lineChart(el, cats, values, color, tipFor, fmtTick);
  const { W } = chartSize(el), H = W < 520 ? 200 : 240, L = 52, R = 14, T = 12, B = 28;
  const top = Math.max(0, ...values), step = niceStep(top), max = step * Math.max(1, Math.ceil(top / step));
  const pw = W - L - R, ph = H - T - B, slot = pw / cats.length;
  const x = i => L + slot * i + slot / 2, y = v => T + ph - v / max * ph;
  let g = `<g class="axis">${axisY(max, step, W, L, R, y, fmtTick)}`;
  cats.forEach((c, i) => { g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(mName(c))}</text>`; });
  g += '</g>';
  const pts = values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  let dots = values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${color}" stroke="var(--panel-2)" stroke-width="2"/>`).join('');
  const hits = cats.map((_, i) => `<rect x="${L + slot * i}" y="${T}" width="${slot}" height="${ph}" fill="transparent" data-i="${i}"/>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${g}<line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ph}" stroke="var(--ink-faint)" stroke-dasharray="3 3" visibility="hidden"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>${dots}${hits}</svg>`;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh');
  svg.addEventListener('mousemove', e => { const tg = e.target.closest('[data-i]'); if (!tg) { xh.setAttribute('visibility', 'hidden'); return hideTip(); }
    const i = +tg.dataset.i; xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible'); showTip(e, tipFor(i)); });
  svg.addEventListener('mouseleave', () => { xh.setAttribute('visibility', 'hidden'); hideTip(); });
}

// horizontal bar list with direct value labels (HTML; reads well at any width)
function hbarList(el, items, color, valFmt = v => fmt(v)) { // items: [{label, value, tip}]
  const max = Math.max(0, ...items.map(i => i.value));
  el.innerHTML = items.length ? `<div class="hlist">${items.map((it, k) => `<div class="row" data-k="${k}"><span class="lab" title="${esc(it.label)}">${esc(it.label)}</span><div class="track"><div class="fill" style="width:${max ? it.value / max * 100 : 0}%;background:${it.color || color}"></div></div><span class="v">${valFmt(it.value)}</span></div>`).join('')}</div>`
    : `<p class="note">${t('no_data')}</p>`;
  el.querySelectorAll('.row').forEach(r => { const it = items[+r.dataset.k];
    if (it.tip) { r.addEventListener('mousemove', e => showTip(e, it.tip)); r.addEventListener('mouseleave', hideTip); } });
}

function donut(el, items, onHover, size = 240) { // items: [{key, color, value}]
  const S2 = 240, R = 110, r = 70, cx = S2 / 2, cy = S2 / 2;
  const tot = items.reduce((s, i) => s + Math.max(0, i.value), 0);
  if (!tot) { el.innerHTML = `<p class="note">${t('no_data')}</p>`; return; }
  let a0 = -Math.PI / 2, paths = '';
  const gap = items.filter(i => i.value > 0).length > 1 ? 0.012 : 0;
  items.forEach(it => {
    if (it.value <= 0) return;
    const a = it.value / tot * Math.PI * 2;
    if (a >= Math.PI * 2 - 1e-6) {
      paths += `<path data-k="${esc(it.key)}" fill="${it.color}" fill-rule="evenodd" d="M${cx + R},${cy} A${R},${R} 0 1 1 ${cx - R},${cy} A${R},${R} 0 1 1 ${cx + R},${cy} Z M${cx + r},${cy} A${r},${r} 0 1 0 ${cx - r},${cy} A${r},${r} 0 1 0 ${cx + r},${cy} Z"/>`;
    } else {
      const s = a0 + gap / 2, e = a0 + a - gap / 2, big = e - s > Math.PI ? 1 : 0;
      const p = (rad, ang) => `${cx + rad * Math.cos(ang)},${cy + rad * Math.sin(ang)}`;
      paths += `<path data-k="${esc(it.key)}" fill="${it.color}" d="M${p(R, s)} A${R},${R} 0 ${big} 1 ${p(R, e)} L${p(r, e)} A${r},${r} 0 ${big} 0 ${p(r, s)} Z"/>`;
    }
    a0 += a;
  });
  el.innerHTML = `<svg class="donut" viewBox="0 0 ${S2} ${S2}" style="max-width:${size}px;margin:0 auto">${paths}</svg>`;
  if (!onHover) return;
  const svg = el.querySelector('svg');
  svg.addEventListener('mousemove', e => { const p = e.target.closest('path'); onHover(p ? p.dataset.k : null, e); });
  svg.addEventListener('mouseleave', () => onHover(null));
}
function linkHighlight(donutEl, listEl, key) {
  const svg = donutEl.querySelector('svg');
  if (svg) { svg.classList.toggle('dim', !!key); svg.querySelectorAll('path').forEach(p => p.classList.toggle('on', p.dataset.k === key)); }
  if (listEl) listEl.querySelectorAll('[data-k]').forEach(x => x.classList.toggle('hl', x.dataset.k === key));
}
// donut + (legend or table) wired both ways; items: [{key, label, color, value}]
function donutLinked(dEl, listEl, items, valFmt = v => fmt(v)) {
  const tot = items.reduce((s, i) => s + i.value, 0);
  donut(dEl, items, (k, e) => {
    linkHighlight(dEl, listEl, k);
    if (!k || !e) return hideTip();
    const it = items.find(x => x.key === k);
    showTip(e, `<div class="t">${esc(it.label)}</div><div class="r"><span>${valFmt(it.value)}</span><span>${pct(it.value, tot)}</span></div>`);
  });
  if (!listEl) return;
  listEl.querySelectorAll('[data-k]').forEach(x => {
    x.addEventListener('mouseenter', () => linkHighlight(dEl, listEl, x.dataset.k));
    x.addEventListener('mouseleave', () => linkHighlight(dEl, listEl, null));
  });
}
function vlegend(items) { // -> html rows with data-k
  const tot = items.reduce((s, i) => s + i.value, 0);
  return items.filter(i => i.value > 0).map(i => `<div data-k="${esc(i.key)}">${sw(i.color)}<span>${esc(i.label)}</span><span class="pct">${pct(i.value, tot)}</span></div>`).join('');
}

// month x rows table used by every "show monthly figures" panel

/* ================================================================== channel mix (channel tab) */
function renderShare() {
  const ms = periodMonths(S.sharePeriod);

  const T0 = rows.reduce((s, r) => s + r.amt, 0), svc = g => g === 'service';
  const p = sumCh(PRODUCT_CH, ms), ord = p[2], aov = ord ? p[0] / ord : 0;

    const gr = rows.filter(r => r.g === g), s = gr.reduce((a, r) => [a[0] + r.amt, a[1] + r.qty, a[2] + r.ord], [0, 0, 0]);
    h += `<tr data-k="${g}"><td><span class="name-cell">${sw(GCOLOR(g))}<b>${esc(gName(g))}</b></span></td>${cells(s[0], s[1], s[2], g).replace(/<td>/g, '<td><b>').replace(/<\/td>/g, '</b></td>')}</tr>`;
    if (gr.length > 1) gr.forEach(r => { h += `<tr class="sub" data-k="${g}"><td style="padding-left:28px">${esc(chName(r.c))}</td>${cells(r.amt, r.qty, r.ord, g)}</tr>`; });
  });

function renderVSoul() {
  const vals = M.map(m => { const mm = DATA.model[m] || {}; let vff = 0, vs = 0, pairs = 0;
    for (const k in mm) { const [b, mod] = k.split('\t'); if (b !== 'VFF') continue; vff += mm[k][0]; if (mod === 'VFF V-Soul') { vs += mm[k][0]; pairs += mm[k][1]; } }
    return { vff, vs, pairs, r: vff ? vs / vff * 100 : 0 }; });
  // pairs and share are different scales, so two charts side by side rather than one dual-axis chart
  barChart($('vsBar'), M, mName, [{ color: 'var(--g-store)', values: vals.map(v => v.pairs) }],
    i => `<div class="t">${esc(M[i].slice(0, 4) + ' ' + mName(M[i]))}</div><div class="r"><span>V-Soul</span><span>${fmt(vals[i].pairs)} ${t('unit_pairs')}</span></div><div class="r"><span>${t('col_amount')}</span><span>${fmt(vals[i].vs)}</span></div>`);
  lineChart($('vsLine'), M, vals.map(v => v.r), 'var(--g-store)', i => `<div class="t">${esc(M[i].slice(0, 4) + ' ' + mName(M[i]))}</div><div class="r"><span>V-Soul</span><span>${vals[i].r.toFixed(1)}%</span></div><div class="r"><span>V-Soul</span><span>${fmt(vals[i].vs)} ${t('unit_thb')}</span></div><div class="r"><span>VFF</span><span>${fmt(vals[i].vff)} ${t('unit_thb')}</span></div>`, v => v + '%');
}

bindSelect('rkPeriod', 'rkPeriod', renderRanking);
bindSelect('bdBrand', 'bdBrand', () => { S.bdShowAll = false; renderBrandDetail(); });
bindSelect('bdPeriod', 'bdPeriod', renderBrandDetail);
$('bdMore').addEventListener('click', () => { S.bdShowAll = !S.bdShowAll; renderBrandDetail(); });

document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => {
  LANG = b.dataset.lang;
  try { localStorage.setItem('edv_lang', LANG); } catch (e) {}
  renderAll();
}));
const redrawCharts = () => document.querySelectorAll('.tab.active .chart').forEach(el => el._redraw && el._redraw());
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.id === 'tab-' + b.dataset.tab));
  hideTip();
  redrawCharts(); // charts in a hidden tab were drawn before they had a width
}));
let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(redrawCharts, 150); });

renderAll();
// deep link: dashboard.html#vff opens that tab
const hashTab = document.querySelector(`nav.tabs button[data-tab="${location.hash.slice(1)}"]`);
if (hashTab) hashTab.click();
</script>
</body>
</html>
